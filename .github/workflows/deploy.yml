name: Deploy ChaBo instance

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "orchestrator/**"
      - "qdrant/**"
      - "scripts/**"
      - "deploy.env"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    if: github.repository != 'ChaBo-Project/instance-example'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check repository safety before deployment
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check-public-safety.py

      # Load all public deployment settings from deploy.env.
      # The validation collects every missing value before stopping.
      - name: Validate deployment configuration
        id: config
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          set -a
          source deploy.env
          set +a

          missing=()
          errors=()

          require_value() {
            local variable_name="$1"

            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("$variable_name")
            fi
          }

          required_variables=(
            INSTANCE_NAME
            CHABO_TAG
            CHATUI_TAG
            ORCHESTRATOR_HF_SPACE
            QDRANT_HF_SPACE
            CHATUI_HF_SPACE
            CHATUI_HF_SPACE_PRIVATE
            HF_SPACES_PRIVATE
            INSTANCE_URL
            QDRANT_URL
            CHATUI_URL
            HF_COLLECTION_TITLE
            HF_COLLECTION_PRIVATE
            EMBEDDING_ENDPOINT_URL
            RERANKER_ENDPOINT_URL
            EMBEDDING_DATASET
            COLLECTION_NAME
            EMBEDDING_DIMENSION
            VECTOR_COLUMN_NAME
            BATCH_SIZE
            TOP_K
            GENERATOR_PROVIDER
            GENERATOR_MODEL
            GENERATOR_MAX_TOKENS
            GENERATOR_TEMPERATURE
            QUERY_REWRITER_ENABLED
          )

          for variable_name in "${required_variables[@]}"; do
            require_value "$variable_name"
          done

          if [[ "${GENERATOR_PROVIDER:-}" == "huggingface" ]]; then
            require_value GENERATOR_INFERENCE_PROVIDER
            require_value GENERATOR_ORGANIZATION
          fi

          if [[ "${GENERATOR_PROVIDER:-}" == "azure" ]]; then
            require_value AZURE_ENDPOINT
          fi

          case "${QUERY_REWRITER_ENABLED:-}" in
            true)
              require_value QUERY_REWRITER_LLM_PROVIDER
              require_value QUERY_REWRITER_LLM_MODEL
              require_value QUERY_REWRITER_LLM_MAX_TOKENS
              require_value QUERY_REWRITER_LLM_TEMPERATURE

              if [[ "${QUERY_REWRITER_LLM_PROVIDER:-}" == "huggingface" ]]; then
                require_value QUERY_REWRITER_LLM_INFERENCE_PROVIDER
                require_value QUERY_REWRITER_LLM_ORGANIZATION
              fi
              ;;
            false)
              ;;
            "")
              # Already reported as a missing variable.
              ;;
            *)
              errors+=(
                "QUERY_REWRITER_ENABLED must be either true or false."
              )
              ;;
          esac

          case "${HF_COLLECTION_PRIVATE:-}" in
            true|false)
              ;;
            "")
              # Already reported as a missing variable.
              ;;
            *)
              errors+=(
                "HF_COLLECTION_PRIVATE must be either true or false."
              )
              ;;
          esac

          case "${CHATUI_HF_SPACE_PRIVATE:-}" in
            true|false)
              ;;
            "")
              # Already reported as a missing variable.
              ;;
            *)
              errors+=(
                "CHATUI_HF_SPACE_PRIVATE must be either true or false."
              )
              ;;
          esac

          case "${HF_SPACES_PRIVATE:-}" in
            true)
              ;;
            "")
              # Already reported as a missing variable.
              ;;
            *)
              errors+=(
                "HF_SPACES_PRIVATE must be true because the "
                "Orchestrator and Qdrant Spaces contain private backend services."
              )
              ;;
          esac

          if [[ -n "${HF_RESOURCE_GROUP_ID:-}" &&
                ! "${HF_RESOURCE_GROUP_ID}" =~ ^[0-9a-fA-F]{24}$ ]]; then
            errors+=(
              "HF_RESOURCE_GROUP_ID must be empty or a 24-character "
              "hexadecimal Resource Group ID."
            )
          fi

          if [[ -z "${HF_TOKEN:-}" ]]; then
            errors+=(
              "GitHub Actions secret HF_TOKEN is missing."
            )
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "ERROR: The following required variables are empty:"

            for variable_name in "${missing[@]}"; do
              echo "  - $variable_name"
            done
          fi

          if (( ${#errors[@]} > 0 )); then
            echo "ERROR: Additional configuration problems:"

            for error_message in "${errors[@]}"; do
              echo "  - $error_message"
            done
          fi

          if (( ${#missing[@]} > 0 || ${#errors[@]} > 0 )); then
            echo
            echo "Deployment stopped before any Hugging Face changes were made."
            exit 1
          fi

          {
            echo "instance_name=$INSTANCE_NAME"
            echo "chabo_tag=$CHABO_TAG"
            echo "chatui_tag=$CHATUI_TAG"
            echo "orchestrator_space=$ORCHESTRATOR_HF_SPACE"
            echo "qdrant_space=$QDRANT_HF_SPACE"
            echo "chatui_space=$CHATUI_HF_SPACE"
            echo "chatui_space_private=$CHATUI_HF_SPACE_PRIVATE"
            echo "chatui_url=$CHATUI_URL"
            echo "hf_resource_group_id=${HF_RESOURCE_GROUP_ID:-}"
          } >> "$GITHUB_OUTPUT"

          echo "PASS: Deployment configuration is complete."

      # Reuse existing private backend Spaces or create them when permitted.
      - name: Create or verify private backend Spaces
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ORCHESTRATOR_HF_SPACE: ${{ steps.config.outputs.orchestrator_space }}
          QDRANT_HF_SPACE: ${{ steps.config.outputs.qdrant_space }}
          HF_RESOURCE_GROUP_ID: ${{ steps.config.outputs.hf_resource_group_id }}
        run: |
          set -euo pipefail

          python3 -m pip install --quiet "huggingface_hub>=0.34,<2"

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          token = os.environ["HF_TOKEN"]
          orchestrator_space = os.environ["ORCHESTRATOR_HF_SPACE"]
          qdrant_space = os.environ["QDRANT_HF_SPACE"]

          resource_group_id = (
              os.environ.get("HF_RESOURCE_GROUP_ID") or None
          )

          if orchestrator_space == qdrant_space:
              raise ValueError(
                  "Orchestrator and Qdrant Spaces must use different "
                  "repository IDs."
              )

          backend_spaces = (
              ("Orchestrator", orchestrator_space),
              ("Qdrant", qdrant_space),
          )

          api = HfApi(token=token)

          for component_name, space_id in backend_spaces:
              try:
                  api.repo_info(
                      repo_id=space_id,
                      repo_type="space",
                  )
                  print(
                      f"INFO: Existing {component_name} "
                      f"Space found: {space_id}"
                  )
              except HfHubHTTPError as error:
                  status_code = getattr(
                      error.response,
                      "status_code",
                      None,
                  )

                  if status_code != 404:
                      raise RuntimeError(
                          f"Unable to verify whether the {component_name} "
                          f"Space {space_id} exists. Check HF_TOKEN access "
                          "to the target organization."
                      ) from error

                  try:
                      api.create_repo(
                          repo_id=space_id,
                          repo_type="space",
                          space_sdk="docker",
                          visibility="private",
                          resource_group_id=resource_group_id,
                          exist_ok=True,
                      )
                      print(
                          f"PASS: Created private {component_name} "
                          f"Space: {space_id}"
                      )
                  except HfHubHTTPError as create_error:
                      create_status = getattr(
                          create_error.response,
                          "status_code",
                          None,
                      )

                      if create_status in (401, 403, 409):
                          raise RuntimeError(
                              f"{component_name} Space {space_id} is "
                              "missing or inaccessible, and HF_TOKEN "
                              "cannot create it. Either grant repository-"
                              "creation permission to HF_TOKEN or manually "
                              "create this Space with Docker SDK and private "
                              "visibility. Then grant HF_TOKEN read and write "
                              "access to the Space and run the workflow again."
                          ) from create_error

                      raise

              try:
                  api.update_repo_settings(
                      repo_id=space_id,
                      repo_type="space",
                      visibility="private",
                  )
              except HfHubHTTPError as settings_error:
                  settings_status = getattr(
                      settings_error.response,
                      "status_code",
                      None,
                  )

                  if settings_status in (401, 403):
                      raise RuntimeError(
                          f"{component_name} Space {space_id} exists, "
                          "but HF_TOKEN cannot enforce private visibility. "
                          "Grant the token write access to this Space."
                      ) from settings_error

                  raise

              print(
                  f"PASS: Private {component_name} Space is ready: "
                  f"{space_id}"
              )
          PY

      # Reuse the configured ChatUI Space or create it when permitted.
      # The configured visibility is also enforced on existing Spaces.
      - name: Create or verify ChatUI Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHATUI_HF_SPACE: ${{ steps.config.outputs.chatui_space }}
          CHATUI_HF_SPACE_PRIVATE: ${{ steps.config.outputs.chatui_space_private }}
          ORCHESTRATOR_HF_SPACE: ${{ steps.config.outputs.orchestrator_space }}
          QDRANT_HF_SPACE: ${{ steps.config.outputs.qdrant_space }}
          HF_RESOURCE_GROUP_ID: ${{ steps.config.outputs.hf_resource_group_id }}
        run: |
          set -euo pipefail

          python3 -m pip install --quiet "huggingface_hub>=0.34,<2"

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          token = os.environ["HF_TOKEN"]
          chatui_space = os.environ["CHATUI_HF_SPACE"]
          chatui_private = (
              os.environ["CHATUI_HF_SPACE_PRIVATE"].lower() == "true"
          )
          visibility = "private" if chatui_private else "public"

          resource_group_id = (
              os.environ.get("HF_RESOURCE_GROUP_ID") or None
          )

          backend_spaces = {
              os.environ["ORCHESTRATOR_HF_SPACE"],
              os.environ["QDRANT_HF_SPACE"],
          }

          if chatui_space in backend_spaces:
              raise ValueError(
                  "CHATUI_HF_SPACE must not match the "
                  "Orchestrator or Qdrant Space."
              )

          api = HfApi(token=token)

          try:
              api.repo_info(
                  repo_id=chatui_space,
                  repo_type="space",
              )
              print(f"INFO: Existing ChatUI Space found: {chatui_space}")
          except HfHubHTTPError as error:
              status_code = getattr(error.response, "status_code", None)

              if status_code != 404:
                  raise RuntimeError(
                      "Unable to verify whether the ChatUI Space exists. "
                      "Check HF_TOKEN access to the target organization."
                  ) from error

              try:
                  api.create_repo(
                      repo_id=chatui_space,
                      repo_type="space",
                      space_sdk="docker",
                      visibility=visibility,
                      resource_group_id=resource_group_id,
                      exist_ok=True,
                  )
                  print(
                      f"PASS: Created {visibility} ChatUI Space: "
                      f"{chatui_space}"
                  )
              except HfHubHTTPError as create_error:
                  create_status = getattr(
                      create_error.response,
                      "status_code",
                      None,
                  )

                  if create_status in (401, 403):
                      raise RuntimeError(
                          f"ChatUI Space {chatui_space} does not exist and "
                          "HF_TOKEN cannot create it. Either grant repository-"
                          "creation permission to HF_TOKEN or manually create "
                          f"this Space with Docker SDK and {visibility} "
                          "visibility."
                      ) from create_error

                  raise

          try:
              api.update_repo_settings(
                  repo_id=chatui_space,
                  repo_type="space",
                  visibility=visibility,
              )
          except HfHubHTTPError as settings_error:
              settings_status = getattr(
                  settings_error.response,
                  "status_code",
                  None,
              )

              if settings_status in (401, 403):
                  raise RuntimeError(
                      f"ChatUI Space {chatui_space} exists, but HF_TOKEN "
                      f"cannot enforce {visibility} visibility. Grant the "
                      "token write access to this Space."
                  ) from settings_error

              raise

          print(
              f"PASS: {visibility.capitalize()} ChatUI Space is ready: "
              f"{chatui_space}"
          )
          PY

      # Configure the public ChatUI without committing backend credentials.
      # CHATUI_BACKEND_TOKEN is optional; HF_TOKEN is used as the fallback.
      - name: Configure ChatUI Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHATUI_BACKEND_TOKEN_OVERRIDE: ${{ secrets.CHATUI_BACKEND_TOKEN }}
        run: |
          set -euo pipefail

          set -a
          source deploy.env
          set +a

          python3 -m pip install --quiet "huggingface_hub>=0.34,<2"

          python3 - <<'PY'
          import json
          import os

          from huggingface_hub import HfApi

          deploy_token = os.environ["HF_TOKEN"]
          backend_token = (
              os.environ.get("CHATUI_BACKEND_TOKEN_OVERRIDE")
              or deploy_token
          )

          chatui_space = os.environ["CHATUI_HF_SPACE"]
          chatui_url = os.environ["CHATUI_URL"].rstrip("/")
          instance_url = os.environ["INSTANCE_URL"].rstrip("/")
          instance_name = os.environ["INSTANCE_NAME"]

          models = [
              {
                  "name": "ChaBo",
                  "displayName": f"{instance_name} Assistant",
                  "description": (
                      "Retrieval-augmented generation powered by ChaBo."
                  ),
                  "instructions": {
                      "title": "Instructions",
                      "content": (
                          "Ask questions about the available documents. "
                          "Answers may include source citations."
                      ),
                  },
                  "multimodal": True,
                  "multimodalAcceptedMimetypes": [
                      "application/pdf",
                  ],
                  "chatPromptTemplate": (
                      "{{#each messages}}"
                      "{{#ifUser}}{{content}}{{/ifUser}}"
                      "{{#ifAssistant}}{{content}}{{/ifAssistant}}"
                      "{{/each}}"
                  ),
                  "parameters": {
                      "temperature": 0.0,
                      "max_new_tokens": 2048,
                  },
                  "endpoints": [
                      {
                          "type": "langserve-streaming",
                          "url": (
                              f"{instance_url}/chatfed-ui-stream"
                          ),
                          "streamingFileUploadUrl": (
                              f"{instance_url}/"
                              "chatfed-with-file-stream"
                          ),
                          "inputKey": "text",
                          "fileInputKey": "files",
                      }
                  ],
              }
          ]

          dotenv_local = "\n".join(
              [
                  f"MODELS=`{json.dumps(models)}`",
                  f"PUBLIC_ORIGIN={json.dumps(chatui_url)}",
                  f"PUBLIC_APP_NAME={json.dumps(instance_name)}",
                  (
                      "PUBLIC_APP_DESCRIPTION="
                      + json.dumps(
                          "Retrieval-augmented assistant powered by ChaBo."
                      )
                  ),
                  "PUBLIC_APP_ASSETS=chatui",
                  "PUBLIC_APP_DISCLAIMER=1",
                  (
                      "PUBLIC_APP_DISCLAIMER_MESSAGE="
                      + json.dumps(
                          "AI-generated answers may be inaccurate. "
                          "Do not enter sensitive personal information."
                      )
                  ),
                  "ENABLE_ASSISTANTS=false",
                  "ENABLE_ASSISTANTS_RAG=false",
                  "COMMUNITY_TOOLS=false",
                  "LLM_SUMMARIZATION=false",
                  "MONGODB_URL=mongodb://localhost:27017",
                  "",
              ]
          )

          api = HfApi(token=deploy_token)

          space_variables = api.get_space_variables(
              repo_id=chatui_space,
          )
          space_secrets = api.get_space_secrets(
              repo_id=chatui_space,
          )

          # HF_TOKEN must exist only as a private secret.
          if "HF_TOKEN" in space_variables:
              api.delete_space_variable(
                  repo_id=chatui_space,
                  key="HF_TOKEN",
              )
              print("INFO: Removed conflicting public HF_TOKEN variable.")

          api.add_space_secret(
              repo_id=chatui_space,
              key="HF_TOKEN",
              value=backend_token,
          )
          print("PASS: Configured private ChatUI secret HF_TOKEN.")

          # DOTENV_LOCAL must exist only as a public variable.
          if "DOTENV_LOCAL" in space_secrets:
              api.delete_space_secret(
                  repo_id=chatui_space,
                  key="DOTENV_LOCAL",
              )
              print("INFO: Removed conflicting DOTENV_LOCAL secret.")

          api.add_space_variable(
              repo_id=chatui_space,
              key="DOTENV_LOCAL",
              value=dotenv_local,
          )
          print("PASS: Configured public ChatUI variable DOTENV_LOCAL.")

          if os.environ.get("CHATUI_BACKEND_TOKEN_OVERRIDE"):
              print("INFO: Using dedicated CHATUI_BACKEND_TOKEN.")
          else:
              print(
                  "INFO: CHATUI_BACKEND_TOKEN is not configured; "
                  "using HF_TOKEN."
              )

          print("PASS: ChatUI Space configured.")
          PY

      # Generate the real params.override.cfg used by the orchestrator.
      # The template itself is not copied into the rendered deployment directory.
      - name: Render orchestrator configuration
        shell: bash
        run: |
          set -euo pipefail

          set -a
          source deploy.env
          set +a

          # Use existing defaults when these optional settings are empty or missing.
          export TITLE_META_FIELDS="${TITLE_META_FIELDS:-filename,page}"
          export FILTERABLE_FIELDS="${FILTERABLE_FIELDS:-}"

          rendered_directory=".rendered/orchestrator/instance_config"

          mkdir -p "$rendered_directory"

          cp \
            orchestrator/instance_config/instance.yaml \
            "$rendered_directory/instance.yaml"

          python3 scripts/render-config.py \
            orchestrator/instance_config/params.override.cfg.template \
            "$rendered_directory/params.override.cfg"

          test -s "$rendered_directory/params.override.cfg"

          if grep -nE '\$\{[A-Z][A-Z0-9_]*\}' \
            "$rendered_directory/params.override.cfg"; then
            echo "ERROR: Unresolved variables remain in params.override.cfg."
            exit 1
          fi

          echo "PASS: Orchestrator configuration rendered successfully."

      # Configure runtime authentication without storing secret values in this repository.
      # Hugging Face restarts the Space automatically when a secret is updated.
      - name: Configure Orchestrator Space secrets
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ORCHESTRATOR_HF_SPACE: ${{ steps.config.outputs.orchestrator_space }}
        run: |
          set -euo pipefail

          python3 -m pip install --quiet "huggingface_hub>=0.34,<2"

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space = os.environ["ORCHESTRATOR_HF_SPACE"]
          api = HfApi(token=token)

          api.add_space_secret(
              repo_id=space,
              key="HF_TOKEN",
              value=token,
          )
          api.add_space_secret(
              repo_id=space,
              key="QDRANT_API_KEY",
              value=token,
          )

          print("PASS: Orchestrator Space secrets configured.")
          PY

      # Copy public Qdrant configuration from deploy.env to the Qdrant Space.
      # Only variable names are printed; no secret values are displayed.
      - name: Configure Qdrant Space variables
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          QDRANT_HF_SPACE: ${{ steps.config.outputs.qdrant_space }}
        run: |
          set -euo pipefail

          set -a
          source deploy.env
          set +a

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["QDRANT_HF_SPACE"]

          variable_names = (
              "EMBEDDING_DATASET",
              "COLLECTION_NAME",
              "EMBEDDING_DIMENSION",
              "VECTOR_COLUMN_NAME",
              "BATCH_SIZE",
              "TOP_K",
          )

          for variable_name in variable_names:
              api.add_space_variable(
                  repo_id=space,
                  key=variable_name,
                  value=os.environ[variable_name],
              )
              print(f"PASS: Configured Qdrant variable {variable_name}.")
          PY

      # Configure Qdrant runtime secrets.
      # Dedicated GitHub secrets are optional; HF_TOKEN is used as the fallback.
      - name: Configure Qdrant Space secrets
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          QDRANT_HF_SPACE: ${{ steps.config.outputs.qdrant_space }}

          # Optional overrides. Missing GitHub secrets become empty values.
          QDRANT_SERVICE_API_KEY_OVERRIDE: ${{ secrets.QDRANT__SERVICE__API_KEY }}
          DATASET_READ_TOKEN_OVERRIDE: ${{ secrets.DATASET_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "$QDRANT_SERVICE_API_KEY_OVERRIDE" ]]; then
            echo "INFO: Using dedicated QDRANT__SERVICE__API_KEY."
          else
            echo "INFO: QDRANT__SERVICE__API_KEY is not set; using HF_TOKEN."
          fi

          if [[ -n "$DATASET_READ_TOKEN_OVERRIDE" ]]; then
            echo "INFO: Using dedicated DATASET_READ_TOKEN."
          else
            echo "INFO: DATASET_READ_TOKEN is not set; using HF_TOKEN."
          fi

          export QDRANT_SERVICE_API_KEY_VALUE="${QDRANT_SERVICE_API_KEY_OVERRIDE:-$HF_TOKEN}"
          export DATASET_READ_TOKEN_VALUE="${DATASET_READ_TOKEN_OVERRIDE:-$HF_TOKEN}"

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["QDRANT_HF_SPACE"]

          space_secrets = {
              "QDRANT__SERVICE__API_KEY": os.environ[
                  "QDRANT_SERVICE_API_KEY_VALUE"
              ],
              "DATASET_READ_TOKEN": os.environ[
                  "DATASET_READ_TOKEN_VALUE"
              ],
          }

          for secret_name, secret_value in space_secrets.items():
              api.add_space_secret(
                  repo_id=space,
                  key=secret_name,
                  value=secret_value,
              )
              print(f"PASS: Configured Qdrant secret {secret_name}.")
          PY

      # All three action references must use the same pinned version.
      - name: Deploy orchestrator
        uses: ChaBo-Project/ChaBo-Deploy/.github/actions/deploy-hf-space@28bee7a2ecfc989fbba28d4e1c808777b88365d2
        with:
          component: orchestrator
          hf_space: ${{ steps.config.outputs.orchestrator_space }}
          image_tag: ${{ steps.config.outputs.chabo_tag }}
          title: "ChaBo Orchestrator — ${{ steps.config.outputs.instance_name }}"
          extra_content_path: .rendered/orchestrator/instance_config
          hf_token: ${{ secrets.HF_TOKEN }}

      - name: Deploy Qdrant
        uses: ChaBo-Project/ChaBo-Deploy/.github/actions/deploy-hf-space@28bee7a2ecfc989fbba28d4e1c808777b88365d2
        with:
          component: qdrant
          hf_space: ${{ steps.config.outputs.qdrant_space }}
          title: "ChaBo Qdrant — ${{ steps.config.outputs.instance_name }}"
          hf_token: ${{ secrets.HF_TOKEN }}

      - name: Deploy ChatUI
        uses: ChaBo-Project/ChaBo-Deploy/.github/actions/deploy-hf-space@28bee7a2ecfc989fbba28d4e1c808777b88365d2
        with:
          component: chatui
          hf_space: ${{ steps.config.outputs.chatui_space }}
          image_tag: ${{ steps.config.outputs.chatui_tag }}
          title: "ChaBo UI — ${{ steps.config.outputs.instance_name }}"
          hf_token: ${{ secrets.HF_TOKEN }}

      - name: Create or update Hugging Face Collection
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          set -a
          source deploy.env
          set +a

          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          token = os.environ["HF_TOKEN"]
          collection_title = os.environ["HF_COLLECTION_TITLE"]
          collection_private = (
              os.environ["HF_COLLECTION_PRIVATE"].lower() == "true"
          )

          resource_group_id = (
              os.environ.get("HF_RESOURCE_GROUP_ID") or None
          )

          chatui_space = os.environ["CHATUI_HF_SPACE"]

          if "/" not in chatui_space:
              raise ValueError(
                  "CHATUI_HF_SPACE must use organization/space-name format."
              )

          collection_namespace = chatui_space.split("/", 1)[0]

          api = HfApi(token=token)

          matching_collections = [
              existing_collection
              for existing_collection in api.list_collections(
                  owner=collection_namespace
              )
              if existing_collection.title == collection_title
          ]

          if len(matching_collections) > 1:
              raise RuntimeError(
                  f"Multiple Collections named {collection_title!r} exist under "
                  f"{collection_namespace}. Rename or remove duplicates so the "
                  "workflow can identify exactly one Collection."
              )

          if matching_collections:
              collection = matching_collections[0]
              print(
                  f"INFO: Existing Hugging Face Collection found: "
                  f"{collection.slug}"
              )
          else:
              try:
                  collection = api.create_collection(
                      title=collection_title,
                      namespace=collection_namespace,
                      private=collection_private,
                      resource_group_id=resource_group_id,
                      exists_ok=True,
                  )
                  print(
                      f"PASS: Created Hugging Face Collection: "
                      f"{collection.slug}"
                  )
              except HfHubHTTPError as create_error:
                  create_status = getattr(
                      create_error.response,
                      "status_code",
                      None,
                  )

                  if create_status in (401, 403):
                      visibility = (
                          "private" if collection_private else "public"
                      )
                      raise RuntimeError(
                          f"Hugging Face Collection {collection_title!r} "
                          f"does not exist under {collection_namespace}, and "
                          "HF_TOKEN cannot create it. Either grant Collection "
                          "creation permission to HF_TOKEN or manually create "
                          f"a {visibility} Collection with this exact title."
                      ) from create_error

                  raise

          try:
              api.update_collection_metadata(
                  collection_slug=collection.slug,
                  private=collection_private,
              )

          except HfHubHTTPError as metadata_error:
              metadata_status = getattr(
                  metadata_error.response,
                  "status_code",
                  None,
              )

              if metadata_status in (401, 403):
                  raise RuntimeError(
                      f"Collection {collection.slug} exists, but HF_TOKEN "
                      "cannot update it. Grant the token write access to "
                      "this Collection."
                  ) from metadata_error

              raise

          items = (
              (os.environ["ORCHESTRATOR_HF_SPACE"], "space"),
              (os.environ["QDRANT_HF_SPACE"], "space"),
              (chatui_space, "space"),
              (os.environ["EMBEDDING_DATASET"], "dataset"),
          )

          for item_id, item_type in items:
              try:
                  api.add_collection_item(
                      collection_slug=collection.slug,
                      item_id=item_id,
                      item_type=item_type,
                      exists_ok=True,
                  )
              except HfHubHTTPError as item_error:
                  item_status = getattr(
                      item_error.response,
                      "status_code",
                      None,
                  )

                  if item_status in (401, 403):
                      raise RuntimeError(
                          f"Collection {collection.slug} exists, but HF_TOKEN "
                          "cannot add deployment resources. Grant the token "
                          "write access to this Collection."
                      ) from item_error

                  if item_status == 404:
                      raise RuntimeError(
                          f"Cannot add {item_type} {item_id} because Hugging "
                          "Face could not find or access that resource."
                      ) from item_error

                  raise

              print(
                  f"PASS: Collection contains {item_type} {item_id}."
              )

          visibility = "private" if collection_private else "public"
          print(
              f"PASS: {visibility.capitalize()} Hugging Face Collection "
              f"is ready: {collection.slug}"
          )
          PY
