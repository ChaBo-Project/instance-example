name: Validate monitoring images

on:
  push:
    paths:
      - "monitoring/**"
      - ".github/workflows/monitoring.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "monitoring/**"
      - ".github/workflows/monitoring.yml"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  prometheus:
    name: Build and test Prometheus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Prometheus image
        run: |
          docker build \
            --pull \
            --tag chabo-prometheus:test \
            monitoring/prometheus

      - name: Start Prometheus image
        run: |
          docker run --detach \
            --name chabo-prometheus-test \
            --publish 127.0.0.1:19090:7860 \
            --env MONITORING_READ_TOKEN=test-token \
            --env INSTANCE_URL=http://127.0.0.1:7860/-/healthy \
            --env QDRANT_URL=http://127.0.0.1:7860/-/healthy \
            --env CHATUI_URL=http://127.0.0.1:7860/-/healthy \
            --env MONITORING_SCRAPE_INTERVAL=15s \
            --env PROMETHEUS_RETENTION_TIME=1h \
            chabo-prometheus:test

      - name: Wait for Prometheus
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:19090/-/ready > /dev/null; then
              echo "PASS: Prometheus is ready."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Prometheus did not become ready."
          exit 1

      - name: Verify ChaBo endpoint probes
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            response="$(
              curl --fail --silent --get \
                --data-urlencode "query=probe_success" \
                http://127.0.0.1:19090/api/v1/query
            )"

            successful_probes="$(
              jq -r \
                '[.data.result[] | select(.value[1] == "1")] | length' \
                <<< "$response"
            )"

            if [[ "$successful_probes" == "3" ]]; then
              echo "PASS: All three ChaBo endpoint probes succeeded."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Not all ChaBo endpoint probes succeeded."
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs chabo-prometheus-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force chabo-prometheus-test || true
  grafana:
    name: Build and test Grafana
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Grafana image
        run: |
          docker build \
            --pull \
            --tag chabo-grafana:test \
            monitoring/grafana

      - name: Start Grafana image
        run: |
          docker run --detach \
            --name chabo-grafana-test \
            --publish 127.0.0.1:13000:7860 \
            --env PROMETHEUS_URL=http://127.0.0.1:9090 \
            --env MONITORING_READ_TOKEN=test-token \
            --env GF_SECURITY_ADMIN_USER=admin \
            --env GF_SECURITY_ADMIN_PASSWORD=test-admin-password \
            --env GF_SERVER_ROOT_URL=http://127.0.0.1:13000 \
            chabo-grafana:test

      - name: Wait for Grafana
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:13000/api/health > /dev/null; then
              echo "PASS: Grafana is ready."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Grafana did not become ready."
          exit 1

      - name: Verify Grafana provisioning
        shell: bash
        run: |
          set -euo pipefail

          dashboard_response="$(
            curl --fail --silent \
              --user admin:test-admin-password \
              "http://127.0.0.1:13000/api/search?query=ChaBo"
          )"

          jq --exit-status \
            'any(.[]; .uid == "chabo-service-overview")' \
            <<< "$dashboard_response" > /dev/null

          datasource_response="$(
            curl --fail --silent \
              --user admin:test-admin-password \
              http://127.0.0.1:13000/api/datasources/uid/chabo-prometheus
          )"

          jq --exit-status \
            '.uid == "chabo-prometheus"
             and .url == "http://127.0.0.1:9090"
             and .secureJsonFields.httpHeaderValue1 == true' \
            <<< "$datasource_response" > /dev/null

          echo "PASS: Grafana dashboard and datasource are provisioned."

      - name: Show Grafana logs
        if: always()
        run: docker logs chabo-grafana-test || true

      - name: Remove Grafana test container
        if: always()
        run: docker rm --force chabo-grafana-test || true